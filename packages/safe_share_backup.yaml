# The app hot-backup hooks prepare native exports. No database shutdown is needed.
script:
  backup_share_safely:
    alias: Backup share safely
    description: >-
      Create an automatic backup using the existing encryption, B2 location and
      retention. The database apps export snapshots through their hot backup
      hooks. Native snapshot checks validate the artifact after upload.
    mode: single
    sequence:
      - condition: state
        entity_id: sensor.backup_backup_manager_state
        state: idle
      - action: backup.create_automatic

automation:
  - id: safe_share_backup_daily
    alias: Backup - safely back up share
    description: >-
      Run the automatic backup daily. App hooks prepare online snapshots and
      artifact validation determines whether this is a complete recovery point.
    triggers:
      - trigger: time
        at: "05:24:00"
    actions:
      - action: script.backup_share_safely
    mode: single
