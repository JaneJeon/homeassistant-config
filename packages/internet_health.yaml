# Internet health: continuous packet loss, and an early-warning "degraded"
# signal shown as the phone's Internet tile.
#
# A finer instrument also runs: the XB3 Telemetry app (homeassistant-apps)
# probes the same three targets once a second and writes straight to
# VictoriaMetrics, next to the modem's line errors. It is not in Home
# Assistant. Grafana's System dashboard shows both.
#
# Source: the Ping (ICMP) integration, set up in the UI (it has no YAML),
# one entry per target, 30 pings per check, a check about once a minute:
#   binary_sensor.ping_gateway / sensor.ping_gateway_packet_loss       10.0.0.1, the Xfinity gateway (local hop)
#   binary_sensor.ping_google_dns / sensor.ping_google_dns_packet_loss  8.8.8.8
#   binary_sensor.ping_cloudflare_dns / ...                             1.1.1.1
#
# Why the extra layer: when every ping in a check fails, the Ping integration
# makes its packet-loss sensor "unavailable" and turns the binary sensor off,
# instead of reporting 100%. A total outage would then show up as a gap in
# Grafana, and the statistics below would ignore it. The "Packet loss - X"
# sensors turn that case back into 100%.
#
# They re-render every minute (a time trigger) on purpose. A trigger-based
# template writes its state on every trigger, so a steady value still produces
# a fresh sample for the 10-minute statistics. A state-based template would
# go quiet on a steady value, and the statistics window would empty out.

template:
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
    sensor:
      - name: Packet loss - Gateway
        unique_id: packet_loss_gateway
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:router-network
        availability: "{{ states('binary_sensor.ping_gateway') in ['on', 'off'] }}"
        state: >-
          {{ 100 if is_state('binary_sensor.ping_gateway', 'off')
             else states('sensor.ping_gateway_packet_loss') | float(none) }}
      - name: Packet loss - Google DNS
        unique_id: packet_loss_google_dns
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:web
        availability: "{{ states('binary_sensor.ping_google_dns') in ['on', 'off'] }}"
        state: >-
          {{ 100 if is_state('binary_sensor.ping_google_dns', 'off')
             else states('sensor.ping_google_dns_packet_loss') | float(none) }}
      - name: Packet loss - Cloudflare DNS
        unique_id: packet_loss_cloudflare_dns
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:web
        availability: "{{ states('binary_sensor.ping_cloudflare_dns') in ['on', 'off'] }}"
        state: >-
          {{ 100 if is_state('binary_sensor.ping_cloudflare_dns', 'off')
             else states('sensor.ping_cloudflare_dns_packet_loss') | float(none) }}

  # On when BOTH outside targets averaged at least 3% loss over the last
  # 10 minutes. Two unrelated targets, so one provider throttling ICMP cannot
  # trigger it. 3% is Jane's line: at that level ordinary browsing already
  # nearly stops, and it is an early warning of worse to come. With 30 pings
  # a minute, 3% over 10 minutes is about 9 lost pings out of 300 per target.
  # This is the phone's Internet tile, and it drives the Telegram alerts at
  # the bottom of this file. (It was 20% until 2026-10-23, an agent's pick for
  # a restart trigger that was never built.)
  - binary_sensor:
      - name: Internet degraded
        unique_id: internet_degraded
        device_class: problem
        availability: >-
          {{ has_value('sensor.packet_loss_google_dns_10_min')
             and has_value('sensor.packet_loss_cloudflare_dns_10_min') }}
        state: >-
          {{ [states('sensor.packet_loss_google_dns_10_min') | float(0),
              states('sensor.packet_loss_cloudflare_dns_10_min') | float(0)] | min >= 3 }}

sensor:
  - platform: statistics
    name: Packet loss - Google DNS 10 min
    unique_id: packet_loss_google_dns_10_min
    entity_id: sensor.packet_loss_google_dns
    state_characteristic: mean
    max_age:
      minutes: 10
    sampling_size: 30
    precision: 1
  - platform: statistics
    name: Packet loss - Cloudflare DNS 10 min
    unique_id: packet_loss_cloudflare_dns_10_min
    entity_id: sensor.packet_loss_cloudflare_dns
    state_characteristic: mean
    max_age:
      minutes: 10
    sampling_size: 30
    precision: 1

automation:
  # Telegram when the Internet tile turns on, and again once it has been off
  # for 15 minutes. Jane said yes to an alert at her 3% line on 2026-10-30.
  #
  # On 2026-10-20 she turned down a Telegram alert because a dead internet
  # cannot deliver one. That still holds for a dead internet, which is caught
  # off-site instead: the Railway Uptime Kuma pages PagerDuty when the Green's
  # 5-minute heartbeat stops. Partial loss usually still lets a message
  # through. If the first message does not get through, the recovery message
  # still says when the alert went off.
  #
  # One episode sends at most two messages. The start alert is skipped while
  # an episode is open (alerted, not yet recovered), so a 10-minute average
  # wobbling around 3% does not repeat it. An episode older than 6 hours no
  # longer blocks a new alert, so a missed recovery cannot silence it for good.
  #
  # continue_on_error: a failed send must not raise an automation error,
  # which would set off the error monitor's own Telegram alert.
  - id: internet_degraded_alert
    alias: Internet - degraded alert
    description: >-
      Tells Jane when Google and Cloudflare both lose 3% or more of pings over
      10 minutes. One message per episode.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.internet_degraded
        from: "off"
        to: "on"
    conditions:
      - condition: template
        value_template: >-
          {% set started = state_attr(this.entity_id, 'last_triggered') %}
          {% set ended = state_attr('automation.internet_recovered_alert', 'last_triggered') %}
          {{ started is none
             or (ended is not none and ended > started)
             or now() - started > timedelta(hours=6) }}
    actions:
      - action: notify.send_message
        continue_on_error: true
        target:
          entity_id: notify.telegram_bot_7842566738_7054392448
        data:
          title: Internet losing pings
          message: >-
            Over the last 10 minutes, {{ states('sensor.packet_loss_google_dns_10_min') }}%
            of pings to Google and {{ states('sensor.packet_loss_cloudflare_dns_10_min') }}%
            to Cloudflare were lost. The gateway lost
            {{ states('sensor.packet_loss_gateway') }}% in its latest check.

  - id: internet_recovered_alert
    alias: Internet - recovered alert
    description: >-
      Tells Jane when ping loss has stayed under 3% for 15 minutes after a
      degraded alert, and how long the trouble lasted.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.internet_degraded
        to: "off"
        for:
          minutes: 15
    conditions:
      - condition: template
        value_template: >-
          {% set started = state_attr('automation.internet_degraded_alert', 'last_triggered') %}
          {% set ended = state_attr(this.entity_id, 'last_triggered') %}
          {{ started is not none
             and (ended is none or started > ended)
             and now() - started < timedelta(hours=24) }}
    actions:
      - action: notify.send_message
        continue_on_error: true
        target:
          entity_id: notify.telegram_bot_7842566738_7054392448
        data:
          title: Internet back under 3% loss
          message: >-
            {% set started = as_local(state_attr('automation.internet_degraded_alert', 'last_triggered')) %}
            {% set minutes = ((now() - started).total_seconds() / 60 - 15) | round(0) | int %}
            Ping loss has been under 3% for 15 minutes. The alert went off at
            {{ started.strftime('%-I:%M %p') }}, and the loss lasted about
            {{ [minutes, 1] | max }} minutes after that.
