      - name: Front corner light Wi-Fi
        unique_id: front_corner_light_wifi
        device_class: connectivity
        availability: "{{ is_state('binary_sensor.mikrotik_snmp_responding', 'on') }}"
        state: "{{ has_value('sensor.front_corner_light_wi_fi_signal') }}"
        attributes:
          signal: >-
            {{ states('sensor.front_corner_light_wi_fi_signal') ~ ' dBm' if has_value('sensor.front_corner_light_wi_fi_signal') else none }}
      - name: IR blaster Wi-Fi
        unique_id: ir_blaster_wifi
        device_class: connectivity
        availability: "{{ is_state('binary_sensor.mikrotik_snmp_responding', 'on') }}"
        state: "{{ has_value('sensor.ir_blaster_wi_fi_signal') }}"
        attributes:
          signal: >-
            {{ states('sensor.ir_blaster_wi_fi_signal') ~ ' dBm' if has_value('sensor.ir_blaster_wi_fi_signal') else none }}
      - name: Ecowitt GW1100 Wi-Fi
        unique_id: ecowitt_gw1100_wifi
        device_class: connectivity
        availability: "{{ is_state('binary_sensor.mikrotik_snmp_responding', 'on') }}"
        state: "{{ has_value('sensor.ecowitt_gw1100_wi_fi_signal') }}"
        attributes:
          signal: >-
            {{ states('sensor.ecowitt_gw1100_wi_fi_signal') ~ ' dBm' if has_value('sensor.ecowitt_gw1100_wi_fi_signal') else none }}
      - name: Brother scanner Wi-Fi
        unique_id: brother_scanner_wifi
