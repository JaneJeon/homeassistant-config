# Plumbing for running this config from git.
#
# Deploy is pull-based: the Git pull app polls GitHub every 5 minutes and
# fast-forwards /config. HA notices the checked-out commit change and reloads
# all YAML. No restart, no inbound access, no deploy secrets in GitHub.
#
# Alerts: drift (files on the Green differ from the repo) and lag (the Green
# is behind GitHub's master, so pulls are failing).

script:
  deploy_config:
    alias: Deploy config from GitHub now
    description: >-
      Starts the Git pull app for an immediate pull instead of waiting for its
      next 5-minute poll. The reload follows from the HEAD change.
    mode: single
    icon: mdi:source-pull
    sequence:
      - action: hassio.app_start
        data:
          app: core_git_pull

command_line:
  - sensor:
      name: Config repo drift
      unique_id: config_repo_drift
      # How many paths on the Green differ from the repo (git status lines, so
      # a new folder counts once), plus which ones, so the alert can name them
      # and nobody has to log in to find out:
      #   changed: tracked files that differ (edited, deleted or renamed)
      #   untracked: files git does not know and does not ignore
      # Names with spaces or unusual characters appear in git's quoted form.
      # If git itself fails, the command exits 1 and the sensor goes unknown
      # instead of reading 0. The drift alert below then says the check is
      # broken.
      command: |-
        s=$(git -C /config status --porcelain) || exit 1
        printf '%s\n' "$s" | awk '
          length($0) == 0 { next }
          {
            p = substr($0, 4)
            # Escape backslashes, then double quotes, so the output is JSON.
            gsub(/\\/, "\\\\\\\\", p)
            gsub(/"/, "\\\"", p)
            if (substr($0, 1, 2) == "??") u = u (u == "" ? "" : ",") "\"" p "\""
            else c = c (c == "" ? "" : ",") "\"" p "\""
            n++
          }
          END { printf "{\"count\":%d,\"changed\":[%s],\"untracked\":[%s]}\n", n, c, u }'
      value_template: "{{ value_json.count }}"
      json_attributes:
        - changed
        - untracked
      unit_of_measurement: files
      scan_interval: 600
  - sensor:
      name: Config repo HEAD
      unique_id: config_repo_head
      command: "git -C /config rev-parse HEAD"
      scan_interval: 60
  - sensor:
      name: Config repo GitHub master
      unique_id: config_repo_github_master
      # Public repo, so no credentials. git ls-remote avoids the GitHub API rate limit.
      command: "git ls-remote https://github.com/JaneJeon/homeassistant-config refs/heads/master | cut -c1-40"
      scan_interval: 300

automation:
  - id: config_as_code_reload_on_new_commit
    alias: Config repo - reload on new commit
    description: >-
      Reloads all YAML when the commit checked out on the Green changes.
      reload_all runs HA's config check first and refuses a broken config.
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.config_repo_head
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and trigger.from_state.state | length == 40
             and trigger.to_state.state | length == 40 }}
    actions:
      - action: homeassistant.reload_all

  # Both alerts poll every 5 minutes instead of using state or template
  # triggers with "for". Those only fire on a change from fine to broken, so a
  # problem that already exists when HA starts or reloads would never alert.
  # Polling also re-alerts every 12 hours while the problem lasts.
  - id: config_repo_drift_alert
    alias: Config repo - drift alert
    description: >-
      Tells Jane when the config on the Green has differed from the GitHub repo
      for 30 minutes, which means something was edited outside the repo, or
      when the drift check itself has not worked for 30 minutes.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: template
        value_template: >-
          {% set s = states.sensor.config_repo_drift %}
          {% set last = state_attr(this.entity_id, 'last_triggered') %}
          {{ s is not none
             and (s.state | int(0) > 0 or not is_number(s.state))
             and now() - s.last_changed > timedelta(minutes=30)
             and (last is none or now() - last > timedelta(hours=12)) }}
    actions:
      - action: notify.send_message
        target:
          entity_id: notify.telegram_bot_7842566738_7054392448
        data:
          title: Config drift
          message: >-
            {% set s = states('sensor.config_repo_drift') %}
            {% set changed = state_attr('sensor.config_repo_drift', 'changed') or [] %}
            {% set untracked = state_attr('sensor.config_repo_drift', 'untracked') or [] %}
            {% if not is_number(s) %}
            The drift check is not working: git status failed on the Green, so
            drift cannot be seen. Home Assistant's log has the error.
            {% else %}
            {% set parts = [s ~ ' file(s) on the Green differ from the homeassistant-config repo. Something was edited outside git.'] %}
            {% if changed %}{% set parts = parts + ['Differ from the repo: ' ~ changed | join(', ') ~ '.'] %}{% endif %}
            {% if untracked %}{% set parts = parts + ['Not in the repo: ' ~ untracked | join(', ') ~ '.'] %}{% endif %}
            {{ parts | join(' ') }}
            {% endif %}

  - id: config_repo_lag_alert
    alias: Config repo - behind GitHub alert
    description: >-
      Tells Jane when the Green has not caught up with GitHub's master for 15
      minutes, which means the Git pull app is failing or stopped.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: template
        value_template: >-
          {% set h = states.sensor.config_repo_head %}
          {% set g = states.sensor.config_repo_github_master %}
          {% set last = state_attr(this.entity_id, 'last_triggered') %}
          {{ h is not none and g is not none
             and h.state | length == 40 and g.state | length == 40
             and h.state != g.state
             and now() - ([h.last_changed, g.last_changed] | max) > timedelta(minutes=15)
             and (last is none or now() - last > timedelta(hours=12)) }}
    actions:
      - action: notify.send_message
        target:
          entity_id: notify.telegram_bot_7842566738_7054392448
        data:
          title: Config deploy stuck
          message: >-
            The Green is on {{ states('sensor.config_repo_head')[:7] }} but
            GitHub master is {{ states('sensor.config_repo_github_master')[:7] }}.
            Check the Git pull app's log.

  # The Git pull app exits when a fetch fails (for example a short DNS outage).
  # The Supervisor watchdog restarts it a few times within a minute, then gives
  # up and leaves it in an error state. Without this, deploys stop silently, and
  # the lag alert only notices once a new commit lands on GitHub.
  # binary_sensor.git_pull_running is disabled by default; it was enabled by hand
  # in Settings > Entities (entity settings live in .storage, not in this repo).
  - id: config_repo_git_pull_watchdog
    alias: Config repo - keep Git pull running
    description: >-
      Starts the Git pull app again when it has been stopped for 5 minutes.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: template
        value_template: >-
          {% set s = states.binary_sensor.git_pull_running %}
          {{ s is not none and s.state == 'off'
             and now() - s.last_changed > timedelta(minutes=5) }}
    actions:
      - action: hassio.app_start
        continue_on_error: true
        data:
          app: core_git_pull

  - id: config_repo_git_pull_down_alert
    alias: Config repo - Git pull down alert
    description: >-
      Tells Jane when the Git pull app has stayed stopped for 30 minutes, which
      means the automatic restarts are not working.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: template
        value_template: >-
          {% set s = states.binary_sensor.git_pull_running %}
          {% set last = state_attr(this.entity_id, 'last_triggered') %}
          {{ s is not none and s.state == 'off'
             and now() - s.last_changed > timedelta(minutes=30)
             and (last is none or now() - last > timedelta(hours=12)) }}
    actions:
      - action: notify.send_message
        target:
          entity_id: notify.telegram_bot_7842566738_7054392448
        data:
          title: Config deploys stopped
          message: >-
            The Git pull app has been stopped for over 30 minutes and restarting
            it isn't working. Changes merged to GitHub won't reach the Green.
            Check the app's log.
