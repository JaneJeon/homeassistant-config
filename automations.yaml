- id: '1784167249575'
  alias: ZP1 - Heartbeat reapply power reporting config [DISABLED - DO NOT RE-ENABLE]
  description: '*** DO NOT RE-ENABLE. THIS AUTOMATION POWER-CYCLES THE ROUTER AND
    THE HA GREEN. ***


    Disabled 2026-07-17. Superseded by ''ZP1 - Reapply power reporting when stale'',
    which does the same job safely. Kept only as a record; delete once the Craft doc
    is confirmed.


    WHY IT IS DANGEROUS: this re-sent configReport to all 4 ZP1 endpoints unconditionally
    every 30 min (48x/day). Sending configReport writes reporting config to the plug''s
    NVM. On ~7% of runs (4 of ~57 on 2026-07-16/17) it faulted the plug MCU mid-radio-transaction
    -> watchdog reset -> relay dropped out and re-closed via power_on_behavior=previous
    -> hard power-cycle of everything downstream. Lower plug (61468) carries the router
    AND the HA Green, so those runs took down internet + HA itself with an unclean
    sqlite shutdown. Upper plug (365) carries the desk.


    IT LOOKS INNOCENT AND IS NOT: no OFF state is ever written to the logbook, because
    the plug reboots and self-restores. The only fingerprint is ''Delivery failed''
    on configReport in the Z2M log plus a burst of republishes. Do not trust ''no
    state change in the logbook'' as evidence the plugs are fine -- that is exactly
    the trap.


    The original premise (that this is ''a no-op if the devices already have the config'')
    is FALSE. It is a write every time.'
  triggers:
  - platform: time_pattern
    minutes: /30
  conditions:
  - condition: template
    value_template: '{{ false }}'
  actions:
  - action: mqtt.publish
    data:
      topic: zigbee2mqtt/bridge/request/device/reporting/configure
      payload: '{"id":"Power Plug (Upper)","endpoint":1,"cluster":"haElectricalMeasurement","attribute":"activePower","minimum_report_interval":5,"maximum_report_interval":10,"reportable_change":10}'
  - delay:
      seconds: 4
  - action: mqtt.publish
    data:
      topic: zigbee2mqtt/bridge/request/device/reporting/configure
      payload: '{"id":"Power Plug (Upper)","endpoint":2,"cluster":"haElectricalMeasurement","attribute":"activePower","minimum_report_interval":5,"maximum_report_interval":10,"reportable_change":10}'
  - delay:
      seconds: 4
  - action: mqtt.publish
    data:
      topic: zigbee2mqtt/bridge/request/device/reporting/configure
      payload: '{"id":"Power Plug (Lower)","endpoint":1,"cluster":"haElectricalMeasurement","attribute":"activePower","minimum_report_interval":5,"maximum_report_interval":10,"reportable_change":10}'
  - delay:
      seconds: 4
  - action: mqtt.publish
    data:
      topic: zigbee2mqtt/bridge/request/device/reporting/configure
      payload: '{"id":"Power Plug (Lower)","endpoint":2,"cluster":"haElectricalMeasurement","attribute":"activePower","minimum_report_interval":5,"maximum_report_interval":10,"reportable_change":10}'
  mode: single
- id: zp1_reapply_power_reporting_when_stale
  alias: ZP1 - Reapply power reporting when stale
  description: 'Checks every 5 min whether any ThirdReality ZP1 endpoint has STOPPED
    reporting activePower, and only then re-sends configure reporting -- to that endpoint
    alone.


    Replaces ''ZP1 - Heartbeat reapply power reporting config'' (id 1784167249575,
    now disabled), which re-sent configReport to all 4 endpoints unconditionally every
    30 min. On 2026-07-16/17 that faulted the plug MCU on ~7% of runs (4 of ~57):
    the plug watchdog-reset, the relay dropped out and re-closed via power_on_behavior=previous,
    hard power-cycling everything downstream -- including the router and the HA Green
    itself. No OFF state was ever logged because the plug reboots and self-restores.
    See Craft doc.


    Threshold is 660s because maximum_report_interval is now 300s: a healthy endpoint
    reports at least every 5 min, so 11 min = 2x + margin => no false positives. If
    you ever change max_report_interval, change this threshold too.


    Writes when healthy: 0/day (vs 48/day for the old heartbeat).'
  triggers:
  - platform: time_pattern
    minutes: /5
  conditions: []
  actions:
  - if:
    - condition: template
      value_template: '{% set s = states[''sensor.0x4ce17552312a0000_power_1''] %}{{
        s is not none and s.state not in [''unknown'',''unavailable''] and (now()
        - s.last_reported).total_seconds() > 660 }}'
    then:
    - action: mqtt.publish
      data:
        topic: zigbee2mqtt/bridge/request/device/reporting/configure
        payload: '{"id":"Power Plug (Upper)","endpoint":1,"cluster":"haElectricalMeasurement","attribute":"activePower","minimum_report_interval":5,"maximum_report_interval":300,"reportable_change":10}'
    - delay:
        seconds: 4
  - if:
    - condition: template
      value_template: '{% set s = states[''sensor.0x4ce17552312a0000_power_2''] %}{{
        s is not none and s.state not in [''unknown'',''unavailable''] and (now()
        - s.last_reported).total_seconds() > 660 }}'
    then:
    - action: mqtt.publish
      data:
        topic: zigbee2mqtt/bridge/request/device/reporting/configure
        payload: '{"id":"Power Plug (Upper)","endpoint":2,"cluster":"haElectricalMeasurement","attribute":"activePower","minimum_report_interval":5,"maximum_report_interval":300,"reportable_change":10}'
    - delay:
        seconds: 4
  - if:
    - condition: template
      value_template: '{% set s = states[''sensor.0x4ce175523e8d0000_power_1''] %}{{
        s is not none and s.state not in [''unknown'',''unavailable''] and (now()
        - s.last_reported).total_seconds() > 660 }}'
    then:
    - action: mqtt.publish
      data:
        topic: zigbee2mqtt/bridge/request/device/reporting/configure
        payload: '{"id":"Power Plug (Lower)","endpoint":1,"cluster":"haElectricalMeasurement","attribute":"activePower","minimum_report_interval":5,"maximum_report_interval":300,"reportable_change":10}'
    - delay:
        seconds: 4
  - if:
    - condition: template
      value_template: '{% set s = states[''sensor.0x4ce175523e8d0000_power_2''] %}{{
        s is not none and s.state not in [''unknown'',''unavailable''] and (now()
        - s.last_reported).total_seconds() > 660 }}'
    then:
    - action: mqtt.publish
      data:
        topic: zigbee2mqtt/bridge/request/device/reporting/configure
        payload: '{"id":"Power Plug (Lower)","endpoint":2,"cluster":"haElectricalMeasurement","attribute":"activePower","minimum_report_interval":5,"maximum_report_interval":300,"reportable_change":10}'
  mode: single
- id: '1786940371075'
  alias: Zoom mode
  description: 'ON: snapshot all four lights, stop Bedroom Adaptive Lighting adapting
    colour, turn OFF everything except the Living Room front corner, and set that
    one to 100% at input_number.zoom_mode_color_temp. Jane tested this on camera 2026-08-17:
    the back lights wash her out, only the front corner should be lit, and it wants
    100% during a call even though her everyday default is ~85%. OFF: restore the
    snapshot (which brings back her 85% and the other lights), re-enable Bedroom AL
    adapt-colour, re-apply AL, and re-trigger the Living Room warm-end correction.
    While ON, moving the Kelvin slider re-applies live. The Living Room warm-end correction
    automation is separately gated on this same boolean, otherwise it would push the
    front corner back to orange within 5 minutes.'
  triggers:
  - entity_id: input_boolean.zoom_mode
    id: 'on'
    platform: state
    to: 'on'
  - entity_id: input_boolean.zoom_mode
    id: 'off'
    platform: state
    to: 'off'
  - entity_id: input_number.zoom_mode_color_temp
    id: retune
    platform: state
  actions:
  - choose:
    - alias: Zoom mode on
      conditions:
      - condition: trigger
        id: 'on'
      sequence:
      - action: scene.create
        alias: Snapshot all four lights so OFF can restore them
        data:
          scene_id: zoom_mode_restore
          snapshot_entities: '{{ zoom_all_lights }}'
      - action: switch.turn_off
        alias: Stop Bedroom Adaptive Lighting re-applying its warm colour
        target:
          entity_id: switch.adaptive_lighting_adapt_color_bedroom
      - action: light.turn_off
        alias: Kill everything behind her
        continue_on_error: true
        data:
          transition: 2
        target:
          entity_id: '{{ zoom_lights_off }}'
      - action: light.turn_on
        alias: 'Front corner becomes the key light: full brightness, neutral white'
        continue_on_error: true
        data:
          brightness_pct: 100
          color_temp_kelvin: '{{ states(''input_number.zoom_mode_color_temp'') | int(4000)
            }}'
          transition: 2
        target:
          entity_id: '{{ zoom_key_light }}'
    - alias: Retune while zoom mode is on
      conditions:
      - condition: trigger
        id: retune
      - condition: state
        entity_id: input_boolean.zoom_mode
        state: 'on'
      sequence:
      - action: light.turn_on
        continue_on_error: true
        data:
          brightness_pct: 100
          color_temp_kelvin: '{{ states(''input_number.zoom_mode_color_temp'') | int(4000)
            }}'
          transition: 2
        target:
          entity_id: '{{ zoom_key_light }}'
    - alias: Zoom mode off
      conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - action: scene.turn_on
        alias: Restore the pre-zoom on/off, brightness and colour
        continue_on_error: true
        data:
          transition: 2
        target:
          entity_id: scene.zoom_mode_restore
      - action: switch.turn_on
        alias: Hand the Bedroom bulbs back to Adaptive Lighting
        target:
          entity_id: switch.adaptive_lighting_adapt_color_bedroom
      - action: adaptive_lighting.apply
        alias: Re-apply Adaptive Lighting now instead of waiting for the 5 minute
          interval
        continue_on_error: true
        data:
          adapt_brightness: false
          adapt_color: true
          entity_id: switch.adaptive_lighting_bedroom
          transition: 2
          turn_on_lights: false
      - action: automation.trigger
        alias: Re-apply the Living Room warm-end correction now
        continue_on_error: true
        data:
          skip_condition: false
        target:
          entity_id: automation.living_room_warm_end_color_correction
  max: 5
  mode: queued
  variables:
    zoom_all_lights:
    - light.living_room_living_room_light_front_corner
    - light.living_room_living_room_light_back_corner
    - light.ikea_smart_light_bulb_upper
    - light.0xc02cedfffe7ce5e3
    zoom_key_light: light.living_room_living_room_light_front_corner
    zoom_lights_off:
    - light.living_room_living_room_light_back_corner
    - light.ikea_smart_light_bulb_upper
    - light.0xc02cedfffe7ce5e3
- id: '1787387816421'
  alias: ZP1 - Read-only liveness poll
  description: Every 5 minutes, publish a READ-ONLY zigbee2mqtt /get to BOTH ThirdReality
    ZP1 plugs by IEEE (0x4ce17552312a0000 = Router+HA-Green dongle; 0x4ce175523e8d0000
    = Xbox+Desk). A /get only READS the device state and forces a fresh unsolicited-style
    report; it NEVER sends configure-reporting and NEVER flash-writes the plug, so
    it carries ZERO reset risk. This is the only safe touch on these plugs. Runs at
    second :30 to avoid the top-of-minute. Companion alert automation watches the
    energy accumulators for staleness. DO NOT convert this to a write/set/configure-reporting
    call.
  triggers:
  - minutes: /5
    platform: time_pattern
    seconds: 30
  actions:
  - data:
      payload: '{"power_1":"","power_2":"","energy_1":"","energy_2":""}'
      topic: zigbee2mqtt/0x4ce17552312a0000/get
    action: mqtt.publish
  - data:
      payload: '{"power_1":"","power_2":"","energy_1":"","energy_2":""}'
      topic: zigbee2mqtt/0x4ce175523e8d0000/get
    action: mqtt.publish
  mode: single
- id: '1787387894351'
  alias: ZP1 - Read-only liveness alert
  description: 'READ-ONLY liveness alert for the two ThirdReality ZP1 plugs. Sends
    Telegram when a plug''s ENERGY accumulator (better proxy than power, which freezes
    on steady load) stops advancing for >90 min despite the 5-min /get poll, plus
    a recovery notice when it resumes. Liveness per plug = newest last_reported across
    BOTH energy endpoints (energy is quantized to 0.01 kWh; low-watt endpoints tick
    slowly, so take whichever ticked most recently). Threshold 90 min (5400s) chosen
    from measured 0.01-kWh tick cadence: Router ~46min, Xbox ~78min, HA-Green ~154min,
    Desk ~10min - 90 min sits above every observed single-endpoint healthy cadence
    so a healthy steady plug never trips. It CANNOT be made shorter without configuring
    faster energy reporting, which needs a FORBIDDEN configure-reporting flash-write.
    BLIND SPOT: plug 0x4ce17552312a0000 powers the router + HA Green; if it hard-crashes,
    HA loses power/internet and CANNOT send Telegram - that case must be caught externally
    (Uptime Kuma seeing the internet drop). This alert reliably covers degraded-reporting
    worsening on either plug and a crash of the Xbox/Desk plug 0x4ce175523e8d0000.
    Residual false-positive: if BOTH endpoints of a plug sit near 0 W (loads switched
    off) for >90 min, energy legitimately stops and looks like an outage - inherent
    to an energy-based signal.'
  triggers:
  - id: staleness_check
    minutes: /5
    platform: time_pattern
    seconds: 45
  - entity_id:
    - sensor.0x4ce17552312a0000_energy_1
    - sensor.0x4ce17552312a0000_energy_2
    - sensor.0x4ce175523e8d0000_energy_1
    - sensor.0x4ce175523e8d0000_energy_2
    id: energy_report
    platform: state
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{% set a = as_timestamp(states[''sensor.0x4ce17552312a0000_energy_1''].last_reported,
          0) %}{% set b = as_timestamp(states[''sensor.0x4ce17552312a0000_energy_2''].last_reported,
          0) %}{% set age = as_timestamp(now()) - [a,b]|max %}{{ trigger.id == ''staleness_check''
          and 5400 < age <= 5730 }}'
      sequence:
      - data:
          message: 'Router/HA-Green plug (0x4ce17552312a0000) has produced NO fresh
            energy reading for {{ ((as_timestamp(now()) - [as_timestamp(states[''sensor.0x4ce17552312a0000_energy_1''].last_reported,0),
            as_timestamp(states[''sensor.0x4ce17552312a0000_energy_2''].last_reported,0)]|max)/60)|round(0)|int
            }} min despite 5-min /get polls - it may have stopped answering. BLIND
            SPOT: this plug powers the router + HA Green, so a HARD crash would take
            HA offline and it could NOT send this. A totally silent HA is the real
            signal here - rely on external Uptime Kuma.'
          title: ZP1 liveness alert
        target:
          entity_id: notify.telegram_bot_7842566738_7054392448
        action: notify.send_message
    - conditions:
      - condition: template
        value_template: '{% set a = as_timestamp(states[''sensor.0x4ce175523e8d0000_energy_1''].last_reported,
          0) %}{% set b = as_timestamp(states[''sensor.0x4ce175523e8d0000_energy_2''].last_reported,
          0) %}{% set age = as_timestamp(now()) - [a,b]|max %}{{ trigger.id == ''staleness_check''
          and 5400 < age <= 5730 }}'
      sequence:
      - data:
          message: Xbox/Desk plug (0x4ce175523e8d0000) has produced NO fresh energy
            reading for {{ ((as_timestamp(now()) - [as_timestamp(states['sensor.0x4ce175523e8d0000_energy_1'].last_reported,0),
            as_timestamp(states['sensor.0x4ce175523e8d0000_energy_2'].last_reported,0)]|max)/60)|round(0)|int
            }} min despite 5-min /get polls - the plug may have crashed or dropped
            off the mesh.
          title: ZP1 liveness alert
        target:
          entity_id: notify.telegram_bot_7842566738_7054392448
        action: notify.send_message
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''energy_report'' and trigger.entity_id
          in [''sensor.0x4ce17552312a0000_energy_1'',''sensor.0x4ce17552312a0000_energy_2'']
          and (as_timestamp(trigger.to_state.last_reported) - [as_timestamp(trigger.from_state.last_reported,
          0), as_timestamp(states[(''sensor.0x4ce17552312a0000_energy_2'' if trigger.entity_id
          == ''sensor.0x4ce17552312a0000_energy_1'' else ''sensor.0x4ce17552312a0000_energy_1'')].last_reported,
          0)]|max) > 5400 }}'
      sequence:
      - data:
          message: Router/HA-Green plug (0x4ce17552312a0000) is answering again -
            fresh energy report after {{ ((as_timestamp(trigger.to_state.last_reported)
            - [as_timestamp(trigger.from_state.last_reported,0), as_timestamp(states[('sensor.0x4ce17552312a0000_energy_2'
            if trigger.entity_id == 'sensor.0x4ce17552312a0000_energy_1' else 'sensor.0x4ce17552312a0000_energy_1')].last_reported,0)]|max)/60)|round(0)|int
            }} min of silence.
          title: ZP1 liveness recovered
        target:
          entity_id: notify.telegram_bot_7842566738_7054392448
        action: notify.send_message
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''energy_report'' and trigger.entity_id
          in [''sensor.0x4ce175523e8d0000_energy_1'',''sensor.0x4ce175523e8d0000_energy_2'']
          and (as_timestamp(trigger.to_state.last_reported) - [as_timestamp(trigger.from_state.last_reported,
          0), as_timestamp(states[(''sensor.0x4ce175523e8d0000_energy_2'' if trigger.entity_id
          == ''sensor.0x4ce175523e8d0000_energy_1'' else ''sensor.0x4ce175523e8d0000_energy_1'')].last_reported,
          0)]|max) > 5400 }}'
      sequence:
      - data:
          message: Xbox/Desk plug (0x4ce175523e8d0000) is answering again - fresh
            energy report after {{ ((as_timestamp(trigger.to_state.last_reported)
            - [as_timestamp(trigger.from_state.last_reported,0), as_timestamp(states[('sensor.0x4ce175523e8d0000_energy_2'
            if trigger.entity_id == 'sensor.0x4ce175523e8d0000_energy_1' else 'sensor.0x4ce175523e8d0000_energy_1')].last_reported,0)]|max)/60)|round(0)|int
            }} min of silence.
          title: ZP1 liveness recovered
        target:
          entity_id: notify.telegram_bot_7842566738_7054392448
        action: notify.send_message
  max: 10
  mode: queued
- id: '1789900078627'
  alias: Resolve - Paperless storage recovered
  description: Clear the Paperless low-storage warning after HA Green remains above
    6 GiB for 30 minutes.
  triggers:
  - platform: numeric_state
    entity_id: sensor.system_monitor_disk_free
    above: 6
    for: 00:30:00
  actions:
  - action: persistent_notification.dismiss
    data:
      notification_id: paperless_storage_low
  - action: telegram_bot.send_message
    data:
      chat_id: 7054392448
      message: '✅ Paperless storage recovered


        HA Green now has {{ states(''sensor.system_monitor_disk_free'') }} GiB free.'
  mode: single
- id: '1789900079944'
  alias: Alert - Paperless storage low
  description: Warn Jane when HA Green free space threatens the Paperless mail archive.
    Fires after 30 minutes below 5 GiB and once daily while still low. The threshold
    preserves time to expand or migrate storage before ingestion fails.
  triggers:
  - platform: numeric_state
    entity_id: sensor.system_monitor_disk_free
    below: 5
    for: 00:30:00
  - platform: time
    at: 09:00:00
  conditions:
  - condition: numeric_state
    entity_id: sensor.system_monitor_disk_free
    below: 5
  actions:
  - action: telegram_bot.send_message
    data:
      chat_id: 7054392448
      message: '⚠️ Paperless storage low


        HA Green has {{ states(''sensor.system_monitor_disk_free'') }} GiB free. Mail
        ingestion is protected by a 5 GiB intervention threshold. Expand or migrate
        Paperless storage before shredding new originals.'
  - action: persistent_notification.create
    data:
      notification_id: paperless_storage_low
      title: Paperless storage low
      message: HA Green has {{ states('sensor.system_monitor_disk_free') }} GiB free.
        Expand or migrate Paperless storage before relying on new scans.
  mode: single
- id: '1789902215888'
  alias: Alert - Automatic backup failed
  description: Warn Jane immediately if Home Assistant reports a failed automatic
    backup. This protects the Paperless pending-shred rule from silent backup failure.
  triggers:
  - platform: state
    entity_id: event.backup_automatic_backup
    attribute: event_type
    to: failed
  actions:
  - action: persistent_notification.create
    data:
      notification_id: automatic_backup_problem
      title: Automatic backup failed
      message: 'Home Assistant reported an automatic backup failure. Do not clear
        the Paperless pending-shred tray until a later backup succeeds. Reason: {{
        state_attr(''event.backup_automatic_backup'', ''failed_reason'') | default(''not
        reported'', true) }}'
  - action: telegram_bot.send_message
    data:
      chat_id: 7054392448
      message: '❌ Automatic backup failed


        Do not clear the Paperless pending-shred tray until a later backup succeeds.


        Reason: {{ state_attr(''event.backup_automatic_backup'', ''failed_reason'')
        | default(''not reported'', true) }}'
  mode: single
- id: '1789902217170'
  alias: Alert - Automatic backup stale
  description: Warn Jane once daily when the last successful automatic Home Assistant
    backup is more than 36 hours old. This protects the Paperless pending-shred rule.
  triggers:
  - platform: time
    at: 09:15:00
  conditions:
  - condition: template
    value_template: '{{ as_timestamp(now()) - as_timestamp(states(''sensor.backup_last_successful_automatic_backup''),
      0) > 129600 }}'
  actions:
  - action: persistent_notification.create
    data:
      notification_id: automatic_backup_problem
      title: Automatic backup is stale
      message: The last successful automatic backup is more than 36 hours old. Do
        not clear the Paperless pending-shred tray until backup health recovers.
  - action: telegram_bot.send_message
    data:
      chat_id: 7054392448
      message: '⚠️ Automatic backup is stale


        The last successful automatic backup is more than 36 hours old. Do not clear
        the Paperless pending-shred tray until backup health recovers.'
  mode: single
- id: '1789902218414'
  alias: Resolve - Automatic backup recovered
  description: Dismiss the backup problem warning whenever Home Assistant records
    a new successful automatic backup.
  triggers:
  - platform: state
    entity_id: sensor.backup_last_successful_automatic_backup
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.from_state is not
      none and trigger.to_state.state not in [''unknown'', ''unavailable'', ''none'',
      ''''] and trigger.to_state.state != trigger.from_state.state }}'
  actions:
  - action: persistent_notification.dismiss
    data:
      notification_id: automatic_backup_problem
  mode: single
- id: '1789903611981'
  alias: Alert - Paperless pipeline service down
  description: Warn Jane if either Paperless-ngx or the Samba ingest service remains
    stopped or unavailable for five minutes. New paper must not be shredded while
    this warning is active.
  triggers:
  - platform: state
    entity_id: binary_sensor.paperless_ngx_running
    to: 'off'
    for: 00:05:00
  - platform: state
    entity_id: binary_sensor.paperless_ngx_running
    to: unavailable
    for: 00:05:00
  - platform: state
    entity_id: binary_sensor.samba_share_running
    to: 'off'
    for: 00:05:00
  - platform: state
    entity_id: binary_sensor.samba_share_running
    to: unavailable
    for: 00:05:00
  actions:
  - action: persistent_notification.create
    data:
      notification_id: paperless_pipeline_service_down
      title: Paperless mail pipeline unavailable
      message: '{{ trigger.to_state.name }} has been {{ trigger.to_state.state }}
        for five minutes. Keep physical mail and do not clear the pending-shred tray
        until both Paperless-ngx and Samba are running again.'
  - action: telegram_bot.send_message
    data:
      chat_id: 7054392448
      message: '❌ Paperless mail pipeline unavailable


        {{ trigger.to_state.name }} has been {{ trigger.to_state.state }} for five
        minutes. Keep physical mail and do not clear the pending-shred tray until
        both services recover.'
  mode: single
- id: '1789903617200'
  alias: Resolve - Paperless pipeline services recovered
  description: Clear the pipeline outage warning when both Paperless-ngx and Samba
    are running again.
  triggers:
  - platform: state
    entity_id: binary_sensor.paperless_ngx_running
    to: 'on'
  - platform: state
    entity_id: binary_sensor.samba_share_running
    to: 'on'
  conditions:
  - condition: state
    entity_id: binary_sensor.paperless_ngx_running
    state: 'on'
  - condition: state
    entity_id: binary_sensor.samba_share_running
    state: 'on'
  actions:
  - action: persistent_notification.dismiss
    data:
      notification_id: paperless_pipeline_service_down
  - action: telegram_bot.send_message
    data:
      chat_id: 7054392448
      message: '✅ Paperless mail pipeline recovered


        Paperless-ngx and Samba are both running again.'
  mode: single
- id: '1789904405839'
  alias: Paperless - Track consume started
  description: Increment the local in-flight counter and start a 45-minute watchdog
    when Paperless begins consuming a scanner PDF. Triggered only by the local Paperless
    workflow webhook. 45 minutes because OCR runs one page at a time on the Green
    (PAPERLESS_THREADS_PER_WORKER=1, set 2026-09-30 after an out-of-memory kill) and
    OCR speed is not a design constraint.
  triggers:
  - allowed_methods:
    - POST
    local_only: true
    platform: webhook
    webhook_id: 3b9d98f8-989d-4d0e-93f6-b9ad7aa683c1
  actions:
  - action: counter.increment
    target:
      entity_id: counter.paperless_ingests_in_flight
  - action: timer.start
    data:
      duration: 00:45:00
    target:
      entity_id: timer.paperless_ingest_watchdog
  max: 20
  mode: queued
- id: '1789904407140'
  alias: Paperless - Track document added
  description: 'Decrement the in-flight counter after Paperless adds a physical-mail
    document, and stop the watchdog once nothing is in flight. It does NOT clear an
    already-reported failure: the webhooks carry no filename, so a later good scan
    cannot prove the failed one arrived. Jane (or an agent that has checked Paperless)
    clears it with the Acknowledge button. Changed 2026-09-30 after a stale count
    turned a successful scan into a false failure alert.'
  triggers:
  - allowed_methods:
    - POST
    local_only: true
    platform: webhook
    webhook_id: f2de5a2c-7360-4387-9698-88ab679fcd74
  actions:
  - action: counter.decrement
    target:
      entity_id: counter.paperless_ingests_in_flight
  - delay: 00:00:01
  - if:
    - below: 1
      condition: numeric_state
      entity_id: counter.paperless_ingests_in_flight
    then:
    - action: timer.cancel
      target:
        entity_id: timer.paperless_ingest_watchdog
  max: 20
  mode: queued
- id: '1789904408407'
  alias: Alert - Paperless ingest did not finish
  description: Warn Jane when a consume-folder PDF starts processing but no Physical
    Mail document is added within 45 minutes. After warning, hand the unfinished count
    over to the persistent problem flag and reset the in-flight counter, so later
    scans are judged on their own and cannot re-fire this alert for an old failure.
    The flag and notification stay until the Acknowledge button is pressed. Preserve
    failed Paperless tasks and source files for diagnosis.
  triggers:
  - event_data:
      entity_id: timer.paperless_ingest_watchdog
    event_type: timer.finished
    platform: event
  conditions:
  - above: 0
    condition: numeric_state
    entity_id: counter.paperless_ingests_in_flight
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.paperless_ingest_problem
  - action: persistent_notification.create
    data:
      message: '{{ stuck }} scanner PDF(s) started processing about 45 minutes before
        {{ now().strftime(''%-I:%M %p on %b %-d'') }} and did not produce a Paperless
        document. Keep the physical originals and do not clear the pending-shred tray.
        Check Paperless Tasks and the consume folder, then press Acknowledge Paperless
        ingest problem once the document is in Paperless.'
      notification_id: paperless_ingest_problem
      title: Paperless ingestion did not finish
  - action: telegram_bot.send_message
    data:
      chat_id: 7054392448
      message: '❌ Paperless ingestion did not finish


        {{ stuck }} scanner PDF(s) started about 45 min ago and did not produce a
        document. Keep the paper and do not clear the pending-shred tray. This warning
        stays on until it is acknowledged.'
  - action: counter.reset
    target:
      entity_id: counter.paperless_ingests_in_flight
  mode: single
  variables:
    stuck: '{{ states(''counter.paperless_ingests_in_flight'') | int(0) }}'
- id: '1789904409678'
  alias: Acknowledge - Paperless ingest problem
  description: Manual recovery control after Jane has inspected and resolved or removed
    the failed source. Resets tracking without deleting Paperless task evidence.
  triggers:
  - platform: state
    entity_id: input_button.acknowledge_paperless_ingest_problem
  actions:
  - action: counter.reset
    target:
      entity_id: counter.paperless_ingests_in_flight
  - action: timer.cancel
    target:
      entity_id: timer.paperless_ingest_watchdog
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.paperless_ingest_problem
  - action: persistent_notification.dismiss
    data:
      notification_id: paperless_ingest_problem
  mode: single
- id: '1789904562655'
  alias: Paperless - Resume ingest watchdog after restart
  description: If Home Assistant restarts while Paperless still has unmatched consume-start
    events, resume the watchdog so the failure cannot be forgotten. 45 minutes because
    single-page-at-a-time OCR can legitimately still be running.
  triggers:
  - event: start
    platform: homeassistant
  conditions:
  - above: 0
    condition: numeric_state
    entity_id: counter.paperless_ingests_in_flight
  actions:
  - delay: 00:02:00
  - action: timer.start
    data:
      duration: 00:45:00
    target:
      entity_id: timer.paperless_ingest_watchdog
  mode: single
