- id: '1777798661659'
  alias: ZP1 - Reapply power reporting on Zigbee rejoin
  description: When either ThirdReality ZP1 dual plug rejoins the Zigbee network,
    re-applies activePower configure reporting (min=5s, max=10s, change=10) to both
    endpoints. Needed because configure reporting is stored on the device and lost
    on rejoin — Z2M does not auto-reapply it.
  triggers:
  - platform: mqtt
    topic: zigbee2mqtt/bridge/event
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json.get(''type'') == ''device_joined'' and
      trigger.payload_json.get(''data'', {}).get(''ieee_address'') in [''0x4ce17552312a0000'',
      ''0x4ce175523e8d0000''] }}'
  actions:
  - delay:
      seconds: 10
  - data:
      topic: zigbee2mqtt/bridge/request/device/reporting/configure
      payload: '{"id":"{{ trigger.payload_json.data.friendly_name }}","endpoint":1,"cluster":"haElectricalMeasurement","attribute":"activePower","minimum_report_interval":5,"maximum_report_interval":10,"reportable_change":10}'
    action: mqtt.publish
  - delay:
      seconds: 4
  - data:
      topic: zigbee2mqtt/bridge/request/device/reporting/configure
      payload: '{"id":"{{ trigger.payload_json.data.friendly_name }}","endpoint":2,"cluster":"haElectricalMeasurement","attribute":"activePower","minimum_report_interval":5,"maximum_report_interval":10,"reportable_change":10}'
    action: mqtt.publish
  mode: parallel
  max: 5
