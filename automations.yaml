- id: '1782553623836'
  alias: Living Room warm-end color correction
  description: 'Rides AL''s computed color curve (switch.adaptive_lighting_living_room)
    but corrects the Linkind bulbs'' warm end toward a tunable anchor, fading the
    correction to zero by the fade-out Kelvin. AL adapt_color is OFF so AL does not
    drive these bulbs; this automation does. Color only — brightness left manual.
    Warm anchor + fade point are live-tunable via input_number helpers (living_room_warm_hue
    / living_room_warm_saturation / living_room_warm_fade_out). Gated off while input_boolean.zoom_mode
    is on, so Zoom mode''s neutral white is not overwritten within 5 minutes. NOTE:
    the variables are split into four sequential steps on purpose. Editing tools that
    write this config alphabetise the keys inside a single variables block, which
    breaks any variable that references another one in the same block. Keep each block
    self-contained.'
  triggers:
  - minutes: /5
    platform: time_pattern
  - event: start
    platform: homeassistant
  - entity_id:
    - light.living_room_living_room_light_front_corner
    - light.living_room_living_room_light_back_corner
    platform: state
    to: 'on'
  - attribute: hs_color
    entity_id: switch.adaptive_lighting_living_room
    platform: state
  - entity_id:
    - input_number.living_room_warm_hue
    - input_number.living_room_warm_saturation
    - input_number.living_room_warm_fade_out
    platform: state
  conditions:
  - condition: state
    entity_id: input_boolean.zoom_mode
    state: 'off'
  - condition: template
    value_template: '{{ is_state(''light.living_room_living_room_light_front_corner'',''on'')
      or is_state(''light.living_room_living_room_light_back_corner'',''on'') }}'
  actions:
  - alias: Inputs (no cross-references)
    variables:
      al_hs: '{{ state_attr(''switch.adaptive_lighting_living_room'',''hs_color'')
        }}'
      al_k: '{{ state_attr(''switch.adaptive_lighting_living_room'',''color_temp_kelvin'')
        | float(1800) }}'
      fade_k: '{{ states(''input_number.living_room_warm_fade_out'') | float(2700)
        }}'
      on_lights: '{{ expand(''light.living_room_living_room_light_front_corner'',''light.living_room_living_room_light_back_corner'')
        | selectattr(''state'',''eq'',''on'') | map(attribute=''entity_id'') | list
        }}'
      warm_h: '{{ states(''input_number.living_room_warm_hue'') | float(26.929) }}'
      warm_s: '{{ states(''input_number.living_room_warm_saturation'') | float(62.992)
        }}'
  - alias: Split AL's hue and saturation, and the fade denominator
    variables:
      al_h: '{{ (al_hs[0] if al_hs else 30) | float(30) }}'
      al_s: '{{ (al_hs[1] if al_hs else 100) | float(100) }}'
      denom: '{{ [fade_k - 1800, 1] | max }}'
  - alias: How strongly the warm correction applies at this Kelvin
    variables:
      strength: '{{ [[ (fade_k - al_k)/denom, 0] | max, 1] | min }}'
  - alias: Blend AL's colour toward the warm anchor
    variables:
      corr_h: '{{ (al_h + (warm_h - al_h) * strength) | round(3) }}'
      corr_s: '{{ (al_s + (warm_s - al_s) * strength) | round(3) }}'
  - action: light.turn_on
    continue_on_error: true
    data:
      hs_color: '{{ [corr_h, corr_s] }}'
      transition: 2
    target:
      entity_id: '{{ on_lights }}'
  mode: restart
