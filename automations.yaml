- id: '1751941562602'
  alias: Automatically turn off rice cooker
  description: 'Turns the rice cooker plug off after 15 minutes of keep-warm-level
    draw (under 30 W). Uses a template trigger, NOT a numeric_state/device power trigger:
    numeric_state only fires when the value CROSSES the threshold. The plug reads
    0 W when off, which is already under 30 W, so if the cooker goes straight from
    off to keep-warm (~23 W) without a high-power cook cycle in between, the value
    never crosses 30 W downward and the old trigger never fired. That is what left
    it on for 18 h on 2026-08-07. The template trigger fires on any false-to-true
    transition, so it also covers the straight-to-keep-warm case. float(999) means
    an unavailable or unknown power reading does NOT trigger a shut-off.'
  triggers:
  - for: 00:15:00
    platform: template
    value_template: '{{ is_state(''switch.0x04e3e5fffe0abb5f'', ''on'') and states(''sensor.0x04e3e5fffe0abb5f_power'')
      | float(999) < 30 }}'
  conditions: []
  actions:
  - target:
      entity_id: switch.0x04e3e5fffe0abb5f
    action: switch.turn_off
  mode: single
