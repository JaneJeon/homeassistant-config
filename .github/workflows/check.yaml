name: Check config

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Core stall watchdog regression checks
        run: python3 tools/test_core_stall_watchdog.py -v

      - name: Native snapshot archive corruption checks
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo python:3.14-slim \
            sh -c 'pip install --disable-pip-version-check pytest==9.2.0 securetar==2026.10.0 && python -m pytest -q tools/test_native_snapshot_archive.py'

      - name: Native backup integration compatibility
        run: |
          for version in "$(tr -d '[:space:]' < .ha-version)" 2026.10.4; do
            docker run --rm --network none -v "$PWD:/repo:ro" --entrypoint python3 \
              "ghcr.io/home-assistant/home-assistant:${version}" \
              /repo/tools/test_native_backup_integration.py
          done

      # Runs Home Assistant's own config check, in the official image,
      # at the version in .ha-version (Renovate bumps it after each HA release).
      # --fail-on-warnings matters: without it, invalid integration config
      # (for example a bad option in a package) still exits 0.
      - name: Home Assistant config check
        if: hashFiles('configuration.yaml') != ''
        run: |
          version="$(tr -d '[:space:]' < .ha-version)"
          cp secrets.fake.yaml secrets.yaml
          docker run --rm --entrypoint "" \
            -v "$PWD:/config" -w /config \
            "ghcr.io/home-assistant/home-assistant:${version}" \
            python -m homeassistant --config /config --script check_config --fail-on-warnings

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
